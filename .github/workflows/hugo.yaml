# 名字随便起，GitHub 界面上会显示这个
name: Deploy Hugo site to Pages

on:
  # 每次你 git push 到 main 分支时自动触发
  push:
    branches:
      - main
  # 允许你在 GitHub 页面上点按钮手动触发
  workflow_dispatch:

# 核心权限设置
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码（升级到 v5 以支持 Node 24）
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 安装 Hugo（升级到 v4，专门解决 Node 20 弃用问题）
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v4
        with:
          hugo-version: '0.160.1'
          extended: true

      # 3. 安装 Dart Sass
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      # 4. 初始化 Pages 环境（升级到 v6）
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # 5. 正式执行 Hugo 编译
      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # 6. 上传 Artifact（升级到 v4）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 发布到 GitHub Pages（升级到 v5）
      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v5